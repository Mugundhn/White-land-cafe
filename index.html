<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>White Land Specialty Coffee — Order</title>
<meta name="description" content="Order White Land Specialty Coffee for delivery or takeaway.">
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=23">
</head>
<body>
<a class="skip" href="#menu">Skip to menu</a>

<div class="promo" role="note"><span>Freshly roasted specialty coffee</span><i aria-hidden="true">·</i><span>Minimum order RM 35</span><i aria-hidden="true">·</i><span>Delivery &amp; takeaway</span></div>
<header class="top">
  <div class="top-row">
    <a class="brand" href="./" aria-label="White Land Specialty Coffee">
      <img class="brand-logo" src="assets/logo-dark.png" width="530" height="900" alt="White Land">
      <span class="brand-sub">SPECIALTY<br>COFFEE</span>
    </a>
    <div class="modes" role="group" aria-label="Order type">
      <button class="mode" data-mode="delivery" aria-pressed="true">Delivery</button>
      <button class="mode" data-mode="takeaway" aria-pressed="false">Takeaway</button>
    </div>
    <button class="cart-btn" id="cartOpen" aria-label="Open cart">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
      <span class="badge" id="cartCount" hidden>0</span>
    </button>
  </div>
  <div class="chips">
    <a class="chip" id="chipStore" href="#" target="_blank" rel="noopener"><b>Store</b><span>Select store</span></a>
    <a class="chip" id="chipLoc" href="#" target="_blank" rel="noopener"><b>Location</b><span>Select location</span></a>
    <a class="chip" id="chipTime" href="#" target="_blank" rel="noopener"><b>Time</b><span>Select time slot</span></a>
  </div>
</header>

<div class="subbar" id="subbar">
  <nav class="cats" id="cats" aria-label="Menu categories"></nav>
  <div class="views" role="group" aria-label="View"><button class="vw" data-view="book" aria-pressed="true">Book</button><button class="vw" data-view="grid" aria-pressed="false">Grid</button></div>
  <form class="search" role="search" id="searchForm">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Search the menu" aria-label="Search the menu" autocomplete="off">
    <button type="button" id="qClear" aria-label="Clear search" hidden>×</button>
  </form>
</div>

<div class="layout">
  <main id="menu" tabindex="-1">
    <div id="status" role="status" class="sr"></div>
    <div id="content"></div>
  </main>
  <aside class="cart-panel" id="cartPanel" aria-label="Your order"></aside>
</div>

<div class="mobile-bar" id="mobileBar" hidden>
  <button id="mobileCart"><span class="mb-count" id="mbCount">0</span><span>View cart</span><strong id="mbTotal">RM 0.00</strong></button>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="cartSheet" role="dialog" aria-modal="true" aria-label="Your order" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/page-flip.browser.js"></script>
<script src="app.js?v=23"></script>
</body>
</html>
